<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verilab Verification Console</title>
<style>
  :root {
    --navy: #1B2A4A;
    --navy-light: #2C4270;
    --teal: #2A7F7E;
    --violet: #5B4B8A;
    --charcoal: #2A2A2A;
    --gray: #5A5F6A;
    --gray-light: #E5E7EB;
    --bg: #FAFAFA;
    --panel: #FFFFFF;
    --border: #D9DCE1;
    --gold: #92650A;
    --gold-bg: #FBF0D9;
    --red: #A02334;
    --red-bg: #FBE9EC;
    --green: #1F6D42;
    --green-bg: #E7F5EC;
  }
  * { box-sizing: border-box; min-width: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 0 20px 64px; background: var(--bg); color: var(--charcoal);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.5;
    overflow-wrap: break-word; overflow-x: hidden;
  }
  .page { max-width: 980px; margin: 0 auto; }
  a { color: var(--teal); }

  header.top { padding: 28px 0 8px; border-bottom: 3px solid var(--navy); margin-bottom: 24px; }
  .wordmark { font-family: Georgia, serif; font-weight: bold; font-size: 30px; color: var(--navy); letter-spacing: 0.5px; }
  .subtitle { font-size: 15px; color: var(--gray); margin-top: 4px; max-width: 640px; }
  .pipeline-strip {
    display: flex; align-items: center; gap: 10px; font-size: 13px;
    color: var(--navy); margin-top: 14px; font-weight: 600; flex-wrap: wrap;
  }
  .pipeline-strip .arrow { color: #aaa; font-weight: normal; }
  .pipeline-strip .gate { background: var(--teal); color: #fff; padding: 4px 12px; border-radius: 6px; }

  section { margin-bottom: 36px; }
  h2.section-title {
    font-family: Georgia, serif; color: var(--navy); font-size: 21px; margin: 0 0 14px;
    border-left: 5px solid var(--teal); padding-left: 12px;
  }

  /* ---------- Layer 0: input ---------- */
  textarea {
    width: 100%; min-height: 200px; padding: 14px; border: 1px solid var(--border);
    border-radius: 8px; font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 13.5px;
    resize: vertical; background: #fff;
  }
  textarea:focus, input[type=text]:focus, button:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--violet); outline-offset: 2px;
  }
  input[type=text] {
    width: 100%; padding: 11px 14px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 15px; margin-bottom: 12px; background: #fff;
  }
  .examples-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
  .example-btn {
    background: #fff; color: var(--navy); border: 1.5px solid var(--navy);
    padding: 9px 16px; border-radius: 20px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .example-btn:hover { background: var(--navy); color: #fff; }
  .actions-row { display: flex; align-items: center; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  button.primary {
    background: var(--teal); color: #fff; border: none; padding: 13px 30px;
    border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  button.primary:disabled { background: #A9B2B2; cursor: default; }

  .stage-tracker { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13.5px; }
  .stage-tracker .step {
    padding: 7px 12px; border-radius: 16px; background: #EEF0F3; color: var(--gray);
    border: 1px solid var(--border);
  }
  .stage-tracker .step.active { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 700; }
  .stage-tracker .step.done { background: var(--gray-light); color: var(--navy); border-color: var(--navy-light); }

  /* ---------- Layer 1 ---------- */
  #results { margin-top: 30px; }
  .status-banner {
    display: flex; align-items: center; gap: 14px; padding: 18px 22px; border-radius: 10px;
    margin-bottom: 10px; font-family: Georgia, serif;
  }
  .status-banner.cleared { background: var(--green-bg); border: 2px solid var(--green); }
  .status-banner.blocked { background: var(--red-bg); border: 2px solid var(--red); }
  .status-banner .status-icon { flex-shrink: 0; }
  .status-banner .status-icon svg { width: 34px; height: 34px; }
  .status-banner.cleared .status-icon svg { color: var(--green); }
  .status-banner.blocked .status-icon svg { color: var(--red); }
  .status-banner .status-text .headline { font-size: 21px; font-weight: 700; }
  .status-banner.cleared .status-text .headline { color: var(--green); }
  .status-banner.blocked .status-text .headline { color: var(--red); }
  .status-banner .status-text .subline { font-size: 15px; color: var(--charcoal); margin-top: 3px; font-family: -apple-system, sans-serif; }

  .checked-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 20px; font-size: 14.5px; color: var(--charcoal); margin-bottom: 18px;
  }
  .checked-box ul { margin: 8px 0 0 20px; padding: 0; }

  .violation-card {
    background: var(--panel); border: 1px solid var(--border); border-left: 5px solid var(--gray);
    border-radius: 8px; margin-bottom: 12px; overflow: hidden;
  }
  .violation-card.sev-error { border-left-color: var(--red); }
  .violation-card.sev-warning { border-left-color: var(--gold); }
  .card-head { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; }
  .cat-icon { flex-shrink: 0; width: 30px; height: 30px; color: var(--navy); }
  .cat-icon.cat-volume { color: var(--teal); }
  .cat-icon.cat-order { color: var(--violet); }
  .cat-icon.cat-tip { color: var(--navy); }
  .cat-icon.cat-data { color: var(--gray); }
  .card-main { flex: 1; min-width: 0; }
  .card-tags { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .cat-label { font-weight: 700; font-size: 13px; color: var(--navy); text-transform: uppercase; letter-spacing: 0.4px; }
  .sev-badge { font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
  .sev-badge.sev-error { background: var(--red-bg); color: var(--red); }
  .sev-badge.sev-warning { background: var(--gold-bg); color: var(--gold); }
  .card-sentence { font-size: 15.5px; overflow-wrap: anywhere; }
  .details-toggle {
    background: #fff; border: 1.5px solid var(--navy); color: var(--navy); font-weight: 600;
    font-size: 13.5px; padding: 8px 14px; border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  .details-toggle:hover { background: var(--navy); color: #fff; }
  .details-toggle[aria-expanded="true"] { background: var(--navy); color: #fff; }

  .card-details { padding: 4px 20px 20px 62px; border-top: 1px solid var(--gray-light); }
  .card-details[hidden] { display: none; }
  .detail-block { margin-top: 14px; }
  .detail-block .detail-label { font-weight: 700; font-size: 12.5px; color: var(--navy); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .detail-block .detail-body { font-size: 14.5px; overflow-wrap: anywhere; }
  .loc-chip {
    display: inline-block; max-width: 100%; background: #EEF0F3; border-radius: 6px;
    padding: 3px 9px; margin: 2px 6px 2px 0; font-size: 13px; font-family: "SF Mono", monospace;
    overflow-wrap: anywhere; word-break: break-word;
  }
  .fix-box { background: #F3FBF6; border: 1px solid var(--green); border-radius: 7px; padding: 10px 14px; font-size: 14.5px; overflow-wrap: anywhere; }

  .tech-toggle {
    margin-top: 14px; background: #fff; border: 1px dashed var(--gray); color: var(--gray);
    font-size: 12.5px; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600;
  }
  .tech-toggle:hover { border-color: var(--navy); color: var(--navy); }
  pre.tech-block {
    background: #14213D; color: #DCE4F0; padding: 14px 16px; border-radius: 8px; overflow-x: auto;
    font-size: 12.5px; margin-top: 10px; line-height: 1.6;
  }
  pre.tech-block[hidden] { display: none; }
  pre.tech-block .tech-heading { color: #7FD6D6; font-weight: 700; }

  .resources-box, .code-box { margin-top: 22px; }
  pre.code-readout {
    background: #14213D; color: #DCE4F0; padding: 16px 18px; border-radius: 8px;
    overflow-x: auto; font-size: 13px; line-height: 1.55;
  }

  .loading-line { color: var(--gray); font-style: italic; margin-top: 14px; }
  .error-box { background: var(--red-bg); border: 1.5px solid var(--red); border-radius: 8px; padding: 14px 18px; color: var(--red); font-weight: 600; }

  /* ---------- Evidence panel ---------- */
  .evidence-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px; }
  .evidence-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .evidence-card h3 { margin: 0 0 8px; font-size: 15.5px; color: var(--navy); font-family: Georgia, serif; }
  .evidence-card .big-number { font-size: 30px; font-weight: 800; color: var(--navy); }
  .evidence-card p.desc { font-size: 13.5px; color: var(--gray); margin: 6px 0 10px; }
  .evidence-list { font-size: 13.5px; margin: 0; padding-left: 18px; }
  .evidence-list li { margin-bottom: 4px; }
  .table-scroll { width: 100%; overflow-x: auto; margin-top: 8px; }
  .scoreboard-table { width: 100%; min-width: 480px; border-collapse: collapse; font-size: 13.5px; }
  .scoreboard-table th, .scoreboard-table td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--gray-light); white-space: nowrap; }
  .scoreboard-table th { color: var(--navy); font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; }
  .status-pill { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11.5px; font-weight: 700; }
  .status-pill.clean { background: var(--green-bg); color: var(--green); }
  .status-pill.clean_with_warnings { background: var(--gold-bg); color: var(--gold); }
  .status-pill.findings { background: var(--red-bg); color: var(--red); }
  .false-alarm-case { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-top: 10px; background: #fcfcfc; }
  .false-alarm-case .fa-title { font-weight: 700; color: var(--navy); font-size: 14px; margin-bottom: 4px; }
  .false-alarm-case .fa-result { color: var(--green); font-weight: 700; font-size: 13.5px; margin-top: 6px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (max-width: 560px) {
    body { padding: 0 14px 48px; }
    .card-head { flex-wrap: wrap; }
    .card-details { padding-left: 20px; }
    .status-banner { flex-wrap: wrap; }
    .status-banner .headline { font-size: 19px; }
    .wordmark { font-size: 25px; }
    .evidence-card .big-number { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="page">

<header class="top">
  <div class="wordmark">VERILAB</div>
  <div class="subtitle">Verification Console. The layer AI-generated robot instructions must pass through before they reach a real Opentrons Flex.</div>
  <div class="pipeline-strip">
    AI writes instructions <span class="arrow">&rarr;</span>
    <span class="gate">VERILAB verifies</span>
    <span class="arrow">&rarr;</span> robot executes
  </div>
</header>

<section aria-labelledby="input-heading">
  <h2 class="section-title" id="input-heading">Verify a protocol</h2>

  <label for="protocolName" class="sr-only">Protocol name</label>
  <input type="text" id="protocolName" placeholder="Protocol name (optional)">

  <label for="protocolText" class="sr-only">Protocol text</label>
  <textarea id="protocolText" placeholder="Paste a wet-lab protocol here, or load an example below."></textarea>

  <div class="examples-row" id="examplesRow" aria-label="Load an example protocol">
    <span class="sr-only">Load example:</span>
  </div>

  <div class="actions-row">
    <button class="primary" id="runBtn">Verify Protocol</button>
    <div class="stage-tracker" id="stageTracker" aria-live="polite"></div>
  </div>

  <div id="results"></div>
</section>

<section aria-labelledby="evidence-heading">
  <h2 class="section-title" id="evidence-heading">Evidence: does this actually work</h2>
  <div id="evidencePanel">
    <p class="loading-line">Loading evidence data...</p>
  </div>
</section>

</div>

<script>
const ICONS = {
  volume: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c3 4 6 8.5 6 12a6 6 0 0 1-12 0c0-3.5 3-8 6-12z"/></svg>',
  order: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8 7l8 4M8 17l8-4"/></svg>',
  tip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6l1 6-4 13-4-13 1-6z"/><path d="M9 8h6"/></svg>',
  data: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.6-2.5 2-2.5 4"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="8" x2="16" y2="16"/><line x1="16" y1="8" x2="8" y2="16"/></svg>',
};

const CATEGORY_LABEL = { volume: 'Volume', order: 'Order', tip: 'Tip reuse', data: 'Needs review' };
const STAGE_ORDER = [
  { stage: 'reading', label: 'Reading the protocol' },
  { stage: 'identify', label: 'Identifying containers and reagents' },
  { stage: 'checking', label: 'Checking volumes, order, and tip use' },
  { stage: 'generating', label: 'Preparing robot code' },
];

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of (children || [])) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function renderStageTracker(container, activeStage) {
  container.innerHTML = '';
  let reachedActive = false;
  for (const s of STAGE_ORDER) {
    const isActive = s.stage === activeStage;
    const isDone = !reachedActive && !isActive;
    if (isActive) reachedActive = true;
    const cls = isActive ? 'step active' : (reachedActive ? 'step' : 'step done');
    container.appendChild(el('span', { class: cls }, [s.label]));
  }
}

// ---------------- Examples ----------------

async function loadExamples() {
  const row = document.getElementById('examplesRow');
  const res = await fetch('/api/examples');
  const examples = await res.json();
  for (const ex of examples) {
    const btn = el('button', {
      type: 'button', class: 'example-btn',
      onclick: () => loadExample(ex.id),
    }, ['Load example: ' + ex.label]);
    row.appendChild(btn);
  }
}

async function loadExample(id) {
  const res = await fetch('/api/examples/' + id);
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  document.getElementById('protocolText').value = data.content;
  document.getElementById('protocolName').value = data.protocol_name;
}

// ---------------- Verify (streaming) ----------------

async function runVerify() {
  const btn = document.getElementById('runBtn');
  const text = document.getElementById('protocolText').value;
  const name = document.getElementById('protocolName').value || 'Untitled Protocol';
  const results = document.getElementById('results');
  const tracker = document.getElementById('stageTracker');

  if (!text.trim()) { alert('Paste a protocol first, or load an example.'); return; }

  btn.disabled = true;
  btn.textContent = 'Verifying...';
  results.innerHTML = '';
  renderStageTracker(tracker, 'reading');

  try {
    const res = await fetch('/api/verify/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ protocol_text: text, protocol_name: name, input_kind: 'auto' }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finalResult = null;
    let errorPayload = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const evt = JSON.parse(line);
        if (evt.type === 'stage') {
          renderStageTracker(tracker, evt.stage);
        } else if (evt.type === 'final') {
          finalResult = evt.result;
        } else if (evt.type === 'error') {
          errorPayload = evt;
        }
      }
    }

    tracker.innerHTML = '';
    if (errorPayload) {
      results.innerHTML = '';
      results.appendChild(el('div', { class: 'error-box' }, ['Error: ' + errorPayload.error]));
    } else if (finalResult) {
      renderResult(results, finalResult);
    } else {
      results.appendChild(el('div', { class: 'error-box' }, ['No result was returned.']));
    }
  } catch (e) {
    results.innerHTML = '';
    results.appendChild(el('div', { class: 'error-box' }, ['Request failed: ' + e.message]));
  } finally {
    btn.disabled = false;
    btn.textContent = 'Verify Protocol';
  }
}

// ---------------- Rendering: Layer 1, 2, 3 ----------------

let violationSeq = 0;

function renderResult(container, data) {
  container.innerHTML = '';

  const cleared = data.overall_status === 'CLEARED';
  const violations = data.checks.violations || [];
  const errorCount = data.checks.error_count;
  const warningCount = data.checks.warning_count;

  const headline = cleared ? 'Cleared for the robot' : 'Do not run yet';
  let subline;
  if (violations.length === 0) {
    subline = 'No problems found. Reviewed against volume limits, step order, and tip reuse.';
  } else if (cleared) {
    subline = warningCount + ' item' + (warningCount === 1 ? '' : 's') + ' worth a second look, nothing blocking.';
  } else {
    subline = errorCount + ' problem' + (errorCount === 1 ? '' : 's') + ' found before this protocol can run.';
  }

  const banner = el('div', { class: 'status-banner ' + (cleared ? 'cleared' : 'blocked') }, [
    el('div', { class: 'status-icon', html: cleared ? ICONS.check : ICONS.stop }, []),
    el('div', { class: 'status-text' }, [
      el('div', { class: 'headline' }, [headline]),
      el('div', { class: 'subline' }, [subline]),
    ]),
  ]);
  container.appendChild(banner);

  if (violations.length === 0) {
    const box = el('div', { class: 'checked-box' }, [
      el('strong', {}, ['Checked against:']),
      el('ul', {}, (data.checks_run || []).map(c => el('li', {}, [c]))),
      el('p', { style: 'margin-top:10px;color:var(--gray);font-size:13.5px;' }, [data.checks_against_text || '']),
    ]);
    container.appendChild(box);
  } else {
    for (const v of violations) {
      container.appendChild(renderViolationCard(v));
    }
  }

  if (data.resources && data.resources.summary_text) {
    const box = el('div', { class: 'resources-box' }, [
      el('h3', { style: 'color:var(--navy);font-family:Georgia,serif;font-size:16px;' }, ['Resources needed']),
      el('pre', { class: 'code-readout' }, [data.resources.summary_text]),
    ]);
    container.appendChild(box);
  }

  if (data.generated_code) {
    const gc = data.generated_code;
    const box = el('div', { class: 'code-box' }, [
      el('h3', { style: 'color:var(--navy);font-family:Georgia,serif;font-size:16px;' },
        [cleared ? 'Code ready to send to the robot' : 'Robot code']),
    ]);
    if (gc.skipped) {
      box.appendChild(el('p', {}, [gc.reason]));
    } else if (gc.code) {
      box.appendChild(el('pre', { class: 'code-readout' }, [gc.code]));
    } else if (gc.error) {
      box.appendChild(el('div', { class: 'error-box' }, ['Code generation failed: ' + gc.error]));
    }
    container.appendChild(box);
  }
}

function renderViolationCard(v) {
  violationSeq += 1;
  const detailsId = 'vdetails-' + violationSeq;
  const techId = 'vtech-' + violationSeq;

  const catIcon = el('div', { class: 'cat-icon cat-' + v.category, html: ICONS[v.category] || ICONS.data, 'aria-hidden': 'true' }, []);

  const toggleBtn = el('button', {
    type: 'button', class: 'details-toggle', 'aria-expanded': 'false', 'aria-controls': detailsId,
  }, ['View details']);

  const head = el('div', { class: 'card-head' }, [
    catIcon,
    el('div', { class: 'card-main' }, [
      el('div', { class: 'card-tags' }, [
        el('span', { class: 'cat-label' }, [v.category_label]),
        el('span', { class: 'sev-badge sev-' + v.severity }, [v.severity]),
      ]),
      el('div', { class: 'card-sentence' }, [v.layer1_summary]),
    ]),
    toggleBtn,
  ]);

  const loc = v.layer2.location || {};
  const locChips = [];
  if (loc.step != null) locChips.push(el('span', { class: 'loc-chip' }, ['Step ' + loc.step]));
  if (loc.reagent) locChips.push(el('span', { class: 'loc-chip' }, [loc.reagent]));
  if (loc.container_well) locChips.push(el('span', { class: 'loc-chip' }, ['Well ' + loc.container_well]));
  if (loc.code_line) locChips.push(el('span', { class: 'loc-chip' }, ['Generated code, line ' + loc.code_line]));

  const details = el('div', { id: detailsId, class: 'card-details', hidden: 'hidden' }, [
    el('div', { class: 'detail-block' }, [
      el('div', { class: 'detail-label' }, ['Exact location']),
      el('div', { class: 'detail-body' }, locChips.length ? locChips : ['No structured location data was available for this item.']),
    ]),
    el('div', { class: 'detail-block' }, [
      el('div', { class: 'detail-label' }, ["What's happening, in numbers"]),
      el('div', { class: 'detail-body' }, [v.layer2.numbers || v.message]),
    ]),
    el('div', { class: 'detail-block' }, [
      el('div', { class: 'detail-label' }, ['What could go wrong']),
      el('div', { class: 'detail-body' }, [v.layer2.risk]),
    ]),
    el('div', { class: 'detail-block' }, [
      el('div', { class: 'detail-label' }, ['Recommended corrected instruction']),
      el('div', { class: 'fix-box' }, [v.layer2.recommended_fix]),
    ]),
  ]);

  const techToggle = el('button', {
    type: 'button', class: 'tech-toggle', 'aria-expanded': 'false', 'aria-controls': techId,
  }, ['Show technical detail']);

  const l3 = v.layer3 || {};
  const techLines = [];
  techLines.push('# extracted step (raw)');
  techLines.push(l3.extracted_step ? JSON.stringify(l3.extracted_step, null, 2) : 'null  (no structured step data for this input)');
  techLines.push('');
  techLines.push('# resolved labware capacity (raw)');
  techLines.push(l3.resolved_capacity ? JSON.stringify(l3.resolved_capacity, null, 2) : 'null  (not applicable to this finding)');
  techLines.push('');
  techLines.push('# generated code');
  if (l3.generated_code_line) {
    techLines.push('line ' + l3.generated_code_line + ': ' + (l3.generated_code_snippet || ''));
  } else {
    techLines.push('null  (no corresponding line found)');
  }
  techLines.push('');
  techLines.push('# checker output (verbatim)');
  techLines.push('code: ' + v.code);
  techLines.push('message: ' + v.message);
  techLines.push('suggested_fix: ' + (v.suggested_fix || 'null'));

  const techBlock = el('pre', { id: techId, class: 'tech-block', hidden: 'hidden' }, [techLines.join('\n')]);

  details.appendChild(techToggle);
  details.appendChild(techBlock);

  toggleBtn.addEventListener('click', () => {
    const expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
    toggleBtn.setAttribute('aria-expanded', String(!expanded));
    if (expanded) { details.setAttribute('hidden', 'hidden'); }
    else { details.removeAttribute('hidden'); }
    toggleBtn.textContent = expanded ? 'View details' : 'Hide details';
  });

  techToggle.addEventListener('click', () => {
    const expanded = techToggle.getAttribute('aria-expanded') === 'true';
    techToggle.setAttribute('aria-expanded', String(!expanded));
    if (expanded) { techBlock.setAttribute('hidden', 'hidden'); }
    else { techBlock.removeAttribute('hidden'); }
    techToggle.textContent = expanded ? 'Show technical detail' : 'Hide technical detail';
  });

  const sevClass = v.severity === 'error' ? 'sev-error' : 'sev-warning';
  return el('div', { class: 'violation-card ' + sevClass }, [head, details]);
}

// ---------------- Evidence panel ----------------

async function loadEvidence() {
  const panel = document.getElementById('evidencePanel');
  try {
    const res = await fetch('/api/evidence');
    const data = await res.json();
    if (data.error) {
      panel.innerHTML = '';
      panel.appendChild(el('div', { class: 'error-box' }, [data.error]));
      return;
    }
    renderEvidence(panel, data);
  } catch (e) {
    panel.innerHTML = '';
    panel.appendChild(el('div', { class: 'error-box' }, ['Could not load evidence: ' + e.message]));
  }
}

function renderEvidence(panel, data) {
  panel.innerHTML = '';
  const grid = el('div', { class: 'evidence-grid' }, []);

  const bc = data.baseline_comparison;
  const baselineCard = el('div', { class: 'evidence-card' }, [
    el('h3', {}, ['Naive single-prompt baseline']),
    el('div', { class: 'big-number' }, [bc.naive_simulated_successfully + ' / ' + bc.protocols_tested]),
    el('p', { class: 'desc' }, ['naive single-prompt protocols simulated successfully.']),
    el('ul', { class: 'evidence-list' }, bc.naive_failures.map(f =>
      el('li', {}, [el('strong', {}, [f.protocol + ': ']), f.reason])
    )),
  ]);

  const pipelineCard = el('div', { class: 'evidence-card' }, [
    el('h3', {}, ['Same protocols, through Verilab']),
    el('div', { class: 'big-number' }, [bc.pipeline_cleared_count + ' / ' + bc.protocols_tested]),
    el('p', { class: 'desc' }, ['cleared with no blocking issues; the rest were correctly blocked with specific, real findings before reaching a robot.']),
    el('ul', { class: 'evidence-list' }, bc.pipeline_blocked_protocols.map(p =>
      el('li', {}, [p.protocol + ': ' + p.finding_count + ' finding(s), blocked before code generation'])
    )),
  ]);

  const ts = data.test_suite;
  const scoreboardCard = el('div', { class: 'evidence-card', style: 'grid-column: 1 / -1;' }, [
    el('h3', {}, ['Protocol test-suite scoreboard']),
    el('p', { class: 'desc' }, [ts.description]),
    el('p', {}, [
      el('strong', {}, [String(ts.total_protocols)]), ' real published protocols run through the full deterministic checker: ',
      el('strong', { style: 'color:var(--green)' }, [ts.clean_count + ' clean']), ', ',
      el('strong', { style: 'color:var(--gold)' }, [ts.clean_with_warnings_count + ' clean with warnings']), ', ',
      el('strong', { style: 'color:var(--red)' }, [ts.findings_count + ' with real findings']), '.',
    ]),
    buildScoreboardTable(ts.protocols),
  ]);

  const faCard = el('div', { class: 'evidence-card', style: 'grid-column: 1 / -1;' }, [
    el('h3', {}, ['False Alarm Cases']),
    ...data.false_alarms.map(fa => el('div', { class: 'false-alarm-case' }, [
      el('div', { class: 'fa-title' }, [fa.case]),
      el('div', { style: 'font-size:13.5px;' }, [fa.description]),
      el('div', { style: 'font-size:12px;color:var(--gray);margin-top:4px;' }, ['Source: ' + fa.source_file]),
      el('div', { class: 'fa-result' }, [fa.result]),
    ])),
  ]);

  grid.appendChild(baselineCard);
  grid.appendChild(pipelineCard);
  grid.appendChild(scoreboardCard);
  grid.appendChild(faCard);
  panel.appendChild(grid);
}

function buildScoreboardTable(protocols) {
  const table = el('table', { class: 'scoreboard-table' }, []);
  const thead = el('thead', {}, [el('tr', {}, [
    el('th', {}, ['Protocol']),
    el('th', {}, ['Steps']),
    el('th', {}, ['Errors']),
    el('th', {}, ['Warnings']),
    el('th', {}, ['Result']),
  ])]);
  const tbody = el('tbody', {}, protocols.map(p => el('tr', {}, [
    el('td', {}, [p.name]),
    el('td', {}, [String(p.step_count)]),
    el('td', {}, [String(p.error_count)]),
    el('td', {}, [String(p.warning_count)]),
    el('td', {}, [el('span', { class: 'status-pill ' + p.status }, [p.status.replace(/_/g, ' ')])]),
  ])));
  table.appendChild(thead);
  table.appendChild(tbody);
  return el('div', { class: 'table-scroll' }, [table]);
}

document.getElementById('runBtn').addEventListener('click', runVerify);
loadExamples();
loadEvidence();
</script>
